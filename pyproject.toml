[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanlens"
version = "0.1.0"
description = "UrbanLens city intelligence application foundation and data tooling"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pymongo>=4.9,<5",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "etl*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
